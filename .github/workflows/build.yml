name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  build:
    # Only ever produce downloadable artifacts from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package zip   # source + built apps/web/dist, no node_modules/certs/.git
        run: |
          python3 -c "
          import os, zipfile
          EXCLUDE = {'node_modules', '.git', '.github', 'certs', '.agent_tmp', 'dist'}
          with zipfile.ZipFile('flight-watch-party.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in EXCLUDE]
                  for f in files:
                      if f == 'flight-watch-party.zip': continue
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
              for root, dirs, files in os.walk('apps/web/dist'):
                  for f in files:
                      z.write(os.path.join(root, f), os.path.join(root, f))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: flight-watch-party
          path: flight-watch-party.zip
          retention-days: 90
